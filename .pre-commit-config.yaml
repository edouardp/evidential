# Pre-commit hooks. Mirrors `scripts/lint.sh` so the same checks run in the
# editor and in CI. Install with `make install-hooks`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-r, -c, .bandit, -q]
        files: ^src/

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [-x, -e, SC2016, -e, SC1091]

  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (dependency audit)
        entry: uv run pip-audit
        language: system
        pass_filenames: false
        always_run: true

      - id: pyrefly
        name: pyrefly (type check)
        entry: uv run pyrefly check
        language: system
        types: [python]
        pass_filenames: false

      - id: checkmake
        name: checkmake (Makefile lint)
        entry: checkmake --config=.checkmake
        language: system
        files: ^Makefile$

      - id: rumdl
        name: rumdl (markdown lint)
        entry: uvx rumdl check README.md CHANGELOG.md docs notebooks skills
        language: system
        types: [markdown]
        pass_filenames: false

      - id: readme-check
        name: readme-check (notebook text and screenshot provenance)
        entry: uv run python -m scripts.generate_readme --check
        language: system
        pass_filenames: false
        always_run: true
