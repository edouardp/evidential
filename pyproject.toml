[project]
name = "evidence-tables"
version = "0.1.0"
description = "Evidence.dev-style interactive data tables for Marimo, powered by anywidget and DuckDB."
readme = "README.md"
authors = [{ name = "Edouard Poor", email = "git@edouard.info" }]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["marimo", "anywidget", "table", "duckdb", "evidence", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "anywidget>=0.9",
    "traitlets>=5.14",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.3", "pyarrow>=17", "pandas>=2.2"]
marimo = ["marimo>=0.20"]
dev = [
    "duckdb>=1.3",
    "pyarrow>=17",
    "pandas>=2.2",
    "marimo>=0.20",
    "boto3>=1.35",
    "bandit>=1.7",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/edouardp/marimo-evidence-tables"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".git", "__pycache__", ".venv", "dist", "frontend", "node_modules"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
