[project]
name = "evidential"
version = "0.1.1"
description = "Evidence.dev-style interactive data tables for Marimo, powered by anywidget and DuckDB."
readme = "docs/PYPI_README.md"
authors = [{ name = "Edouard Poor", email = "git@edouard.info" }]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["marimo", "anywidget", "table", "duckdb", "evidential", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "anywidget>=0.9",
    "traitlets>=5.14",
]

[project.optional-dependencies]
# Runtime extras: `pip install evidential[duckdb]` / `[...][marimo]` / `[...][studio]`.
duckdb = ["duckdb>=1.3", "pyarrow>=17", "pandas>=2.2"]
marimo = ["marimo>=0.20"]
# marimo Studio: build named views of a notebook (see docs/marimo-studio.md).
studio = ["marimo-studio>=0.3,<0.4"]

[dependency-groups]
dev = [
    "bandit>=1.7",
    "boto3>=1.35",
    "duckdb>=1.3",
    "marimo>=0.20",
    "pandas>=2.2",
    "pip-audit>=2.7",
    "playwright>=1.40",
    "pre-commit>=4.0",
    "pyarrow>=17",
    "pyrefly>=0.57",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "scipy>=1.17.1",
]

[project.urls]
Homepage = "https://github.com/edouardp/evidential"
Repository = "https://github.com/edouardp/evidential"
Issues = "https://github.com/edouardp/evidential/issues"
Changelog = "https://github.com/edouardp/evidential/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
target-version = "py311"
line-length = 120
# Marimo notebooks are checked by `marimo check`; their cell-return idiom
# trips ordinary Python lint rules, so keep them out of Ruff (as galaga keeps
# its examples out).
exclude = [".git", "__pycache__", ".venv", "dist", "frontend", "notebooks", "node_modules", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["evidential"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not browser'"
markers = [
    "browser: real-browser functional tests (need Playwright + a Chromium browser)",
]

[tool.coverage.run]
source = ["evidential"]
omit = ["*/static/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.pyrefly]
search-path = ["src"]
# Type-check the shipped package (tests and notebooks are exercised at runtime).
project-includes = ["src/evidential/**/*.py"]
project-excludes = ["**/__pycache__", ".venv", "**/static/**"]
